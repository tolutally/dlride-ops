openapi: 3.1.0

info:
  title: DLride Ops API
  version: 1.0.0
  description: |
    REST contract between the public DLride rental application website and the
    internal DLride Ops application. This document defines behavior only; it
    does not prescribe an implementation.

tags:
  - name: Applications
    description: Rental application submission and internal processing.
  - name: Customers
    description: Reserved customer endpoints. Not implemented in version 1.0.0.
  - name: Fleet
    description: Reserved fleet endpoints. Not implemented in version 1.0.0.
  - name: Rentals
    description: Reserved rental endpoints. Not implemented in version 1.0.0.
  - name: Renewals
    description: Reserved renewal endpoints. Not implemented in version 1.0.0.

paths:
  /applications:
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create a rental application
      description: |
        Public endpoint that accepts application fields, a Cloudflare Turnstile
        token, an empty honeypot, and both required documents as multipart form
        data. The server applies a rolling limit of five attempts per source IP
        per hour, verifies Turnstile, validates all fields and detected file
        content, and only then uploads documents and creates the application.
        `application_number`, `status`, `rental_weeks`, document storage paths,
        and timestamps are assigned by the backend and are not accepted from the
        caller.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            encoding:
              drivers_license:
                contentType: image/jpeg, image/png, application/pdf
              proof_of_address:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        '201':
          description: Application created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationSuccessResponse'
        '400':
          $ref: '#/components/responses/ApplicationBadRequest'
        '403':
          $ref: '#/components/responses/BotVerificationFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ApplicationValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Applications]
      operationId: listApplications
      summary: List applications
      description: Returns a filtered, sorted, paginated application list.
      security:
        - staffBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ApplicationStatusFilter'
        - $ref: '#/components/parameters/ApplicationSearch'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/IntendedVehicleUseFilter'
        - $ref: '#/components/parameters/ApplicationSort'
      responses:
        '200':
          description: Paginated applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'

    get:
      tags: [Applications]
      operationId: getApplication
      summary: Get a complete application
      description: |
        Returns the complete internal application record. Document values are
        temporary signed URLs with explicit expiry timestamps; permanent public
        URLs and raw storage paths are never returned.
      security:
        - staffBearerAuth: []
      responses:
        '200':
          description: Complete application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Update internal application processing fields
      description: |
        Updates only status, internal notes, decision reason, reviewer, and
        review timestamp. Applicant, rental, consent, document, calculated, and
        system-created fields are not writable through this endpoint.
      security:
        - staffBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Application updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRecordSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '422':
          $ref: '#/components/responses/UpdateValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /applications/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'

    get:
      tags: [Applications]
      operationId: getApplicationDocuments
      summary: Get temporary application document URLs
      description: |
        Returns short-lived signed URLs for the Driver's Licence and Proof of
        Address. Access requires authenticated staff authorization. The URLs
        are temporary and must never be treated as permanent public URLs.
      security:
        - staffBearerAuth: []
      responses:
        '200':
          description: Temporary signed document URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDocumentsSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApplicationOrDocumentsNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomersPlaceholder
      summary: List customers (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Customers]
      operationId: createCustomerPlaceholder
      summary: Create a customer (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Customers]
      operationId: getCustomerPlaceholder
      summary: Get a customer (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    patch:
      tags: [Customers]
      operationId: updateCustomerPlaceholder
      summary: Update a customer (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /fleet:
    get:
      tags: [Fleet]
      operationId: listFleetPlaceholder
      summary: List fleet vehicles (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Fleet]
      operationId: createFleetVehiclePlaceholder
      summary: Create a fleet vehicle (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /fleet/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Fleet]
      operationId: updateFleetVehiclePlaceholder
      summary: Update a fleet vehicle (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /rentals:
    get:
      tags: [Rentals]
      operationId: listRentalsPlaceholder
      summary: List rentals (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Rentals]
      operationId: createRentalPlaceholder
      summary: Create a rental (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /rentals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Rentals]
      operationId: updateRentalPlaceholder
      summary: Update a rental (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /renewals:
    get:
      tags: [Renewals]
      operationId: listRenewalsPlaceholder
      summary: List renewals (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Renewals]
      operationId: createRenewalPlaceholder
      summary: Create a renewal (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /renewals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Renewals]
      operationId: updateRenewalPlaceholder
      summary: Update a renewal (placeholder)
      x-placeholder: true
      security:
        - staffBearerAuth: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  securitySchemes:
    staffBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Contract marker for authenticated staff access. Token issuance, staff
        role representation, and authentication endpoints are out of scope.

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: Application UUID.
      schema:
        type: string
        format: uuid

    ResourceId:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Number of applications per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    ApplicationStatusFilter:
      name: status
      in: query
      description: Return only applications with this status.
      schema:
        $ref: '#/components/schemas/ApplicationStatus'

    ApplicationSearch:
      name: search
      in: query
      description: |
        Case-insensitive search across application number, applicant first and
        last name, email, and phone.
      schema:
        type: string
        minLength: 1
        maxLength: 200

    CreatedFrom:
      name: created_from
      in: query
      description: Include applications created on or after this calendar date.
      schema:
        type: string
        format: date

    CreatedTo:
      name: created_to
      in: query
      description: Include applications created on or before this calendar date.
      schema:
        type: string
        format: date

    IntendedVehicleUseFilter:
      name: intended_vehicle_use
      in: query
      description: Return only applications with this intended vehicle use.
      schema:
        $ref: '#/components/schemas/IntendedVehicleUse'

    ApplicationSort:
      name: sort
      in: query
      description: |
        `newest` sorts created date descending. `oldest` sorts created date
        ascending. `rental_start` and `rental_end` sort their respective dates
        ascending.
      schema:
        type: string
        enum: [newest, oldest, rental_start, rental_end]
        default: newest

  schemas:
    IntendedVehicleUse:
      type: string
      enum:
        - gig_work
        - road_trips
        - personal_use
        - travel_nursing
        - other

    ApplicationStatus:
      type: string
      enum:
        - submitted
        - under_review
        - more_information_required
        - approved
        - denied
        - cancelled

    PaymentMethod:
      type: string
      enum: [cash, e-transfer, card]
      description: Exact value submitted by the public website payment-method control.

    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - street_address
        - city
        - state
        - postal_code
        - phone
        - email
        - rental_start_date
        - rental_end_date
        - intended_vehicle_use
        - payment_method
        - drivers_license
        - proof_of_address
        - sms_consent
        - company_name
        - cf-turnstile-response
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        street_address:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        postal_code:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        rental_start_date:
          type: string
          format: date
          description: Must not be in the past on submission.
        rental_end_date:
          type: string
          format: date
          description: Must be at least 7 days after rental_start_date.
        intended_vehicle_use:
          $ref: '#/components/schemas/IntendedVehicleUse'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        additional_information:
          type: [string, 'null']
        drivers_license:
          type: string
          format: binary
          description: |
            Required Driver's Licence upload. Maximum 10 MB. Accepted detected
            content types: image/jpeg, image/png, and application/pdf. Browser
            filenames and declared MIME types are not authoritative.
        proof_of_address:
          type: string
          format: binary
          description: |
            Required Utility Bill / Proof of Address upload. Maximum 10 MB.
            Accepted detected content types: image/jpeg, image/png, and
            application/pdf. Browser filenames and declared MIME types are not
            authoritative.
        sms_consent:
          type: boolean
          const: true
          description: Must be explicitly submitted as true.
        company_name:
          type: string
          maxLength: 0
          description: Anti-spam honeypot. Must be present and empty.
        cf-turnstile-response:
          type: string
          minLength: 1
          maxLength: 2048
          description: Cloudflare Turnstile token verified server-side.

    UpdateApplicationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        internal_notes:
          type: [string, 'null']
        decision_reason:
          type: [string, 'null']
        reviewed_by:
          type: [string, 'null']
          format: uuid
        reviewed_at:
          type: [string, 'null']
          format: date-time

    ApplicantInformation:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - street_address
        - city
        - state
        - postal_code
        - phone
        - email
      properties:
        first_name:
          type: string
        last_name:
          type: string
        street_address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    ApplicantSummary:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email, phone]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    RentalDetails:
      type: object
      additionalProperties: false
      required:
        - rental_start_date
        - rental_end_date
        - rental_weeks
        - intended_vehicle_use
        - payment_method
      properties:
        rental_start_date:
          type: string
          format: date
        rental_end_date:
          type: string
          format: date
        rental_weeks:
          type: integer
          minimum: 1
          readOnly: true
          description: Ceiling of rental duration in days divided by seven.
        intended_vehicle_use:
          $ref: '#/components/schemas/IntendedVehicleUse'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'

    ApplicationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - application_number
        - applicant
        - rental
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        application_number:
          type: string
          pattern: '^DLR-[0-9]{6}$'
        applicant:
          $ref: '#/components/schemas/ApplicantSummary'
        rental:
          $ref: '#/components/schemas/RentalDetails'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - application_number
        - applicant
        - rental
        - sms_consent
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        application_number:
          type: string
          pattern: '^DLR-[0-9]{6}$'
        applicant:
          $ref: '#/components/schemas/ApplicantInformation'
        rental:
          $ref: '#/components/schemas/RentalDetails'
        additional_information:
          type: [string, 'null']
        sms_consent:
          type: boolean
          const: true
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        internal_notes:
          type: [string, 'null']
        decision_reason:
          type: [string, 'null']
        reviewed_by:
          type: [string, 'null']
          format: uuid
        reviewed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - application_number
        - applicant
        - rental
        - sms_consent
        - status
        - documents
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        application_number:
          type: string
          pattern: '^DLR-[0-9]{6}$'
        applicant:
          $ref: '#/components/schemas/ApplicantInformation'
        rental:
          $ref: '#/components/schemas/RentalDetails'
        additional_information:
          type: [string, 'null']
        sms_consent:
          type: boolean
          const: true
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        internal_notes:
          type: [string, 'null']
        decision_reason:
          type: [string, 'null']
        reviewed_by:
          type: [string, 'null']
          format: uuid
        reviewed_at:
          type: [string, 'null']
          format: date-time
        documents:
          $ref: '#/components/schemas/ApplicationDocuments'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SignedDocument:
      type: object
      additionalProperties: false
      required: [signed_url, expires_at]
      properties:
        signed_url:
          type: string
          format: uri
          description: Temporary private URL; never a permanent public URL.
        expires_at:
          type: string
          format: date-time

    ApplicationDocuments:
      type: object
      additionalProperties: false
      required: [drivers_license, proof_of_address]
      properties:
        drivers_license:
          $ref: '#/components/schemas/SignedDocument'
        proof_of_address:
          $ref: '#/components/schemas/SignedDocument'

    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    CreateApplicationResult:
      type: object
      additionalProperties: false
      required: [id, application_number, status, rental_weeks, created_at]
      properties:
        id:
          type: string
          format: uuid
        application_number:
          type: string
          pattern: '^DLR-[0-9]{6}$'
          example: DLR-000001
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        rental_weeks:
          type: integer
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time

    ApplicationListResult:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Descriptive human-readable error message.
        details:
          type: array
          description: Optional field-level validation errors.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'

    CreateApplicationSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CreateApplicationResult'

    ApplicationListSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ApplicationListResult'

    ApplicationRecordSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ApplicationRecord'

    ApplicationDetailSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ApplicationDetail'

    ApplicationDocumentsSuccessResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ApplicationDocuments'

  responses:
    ApplicationBadRequest:
      description: Malformed application request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: The request could not be parsed.

    BotVerificationFailed:
      description: The Turnstile token is missing, invalid, expired, reused, or could not be verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BOT_VERIFICATION_FAILED
              message: Verification failed. Please try again.

    BadRequest:
      description: Malformed request, invalid UUID, invalid query value, or unreadable body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: The request could not be parsed.

    Unauthorized:
      description: A valid staff access token was not provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication is required.

    Forbidden:
      description: The authenticated identity is not authorized as staff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Staff access is required.

    ApplicationNotFound:
      description: No application exists for the supplied UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: APPLICATION_NOT_FOUND
              message: Application not found.

    ApplicationOrDocumentsNotFound:
      description: The application or one of its required documents does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            applicationNotFound:
              value:
                success: false
                error:
                  code: APPLICATION_NOT_FOUND
                  message: Application not found.
            documentsNotFound:
              value:
                success: false
                error:
                  code: DOCUMENTS_NOT_FOUND
                  message: One or more required application documents were not found.

    PayloadTooLarge:
      description: One or more uploaded documents exceeds 10 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: PAYLOAD_TOO_LARGE
              message: Each document must be 10 MB or smaller.

    UnsupportedMediaType:
      description: |
        The body is not multipart form data or detected document content is not
        JPEG, PNG, or PDF.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Documents must be JPEG, PNG, or PDF files.

    ApplicationValidationFailed:
      description: The application failed server-side validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rentalDateOrder:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Rental end date must be after rental start date.
                  details:
                    - field: rental_end_date
                      message: Rental end date must be after rental start date.
            minimumRentalPeriod:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Minimum rental period is 7 days.
                  details:
                    - field: rental_end_date
                      message: Minimum rental period is 7 days.
            governmentIdRequired:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Government ID is required.
                  details:
                    - field: drivers_license
                      message: Government ID is required.
            proofOfAddressRequired:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Proof of address is required.
                  details:
                    - field: proof_of_address
                      message: Proof of address is required.
            smsConsentRequired:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: SMS consent is required.
                  details:
                    - field: sms_consent
                      message: SMS consent is required.
            genericSpamRejection:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: The application could not be submitted.

    RateLimited:
      description: More than five submissions were attempted from the source IP within one hour.
      headers:
        Retry-After:
          description: Seconds until another submission attempt is permitted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many applications submitted. Please try again later.

    UpdateValidationFailed:
      description: One or more application update values failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: The application update is invalid.

    NotImplemented:
      description: The reserved endpoint has no implementation or finalized resource schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_IMPLEMENTED
              message: This endpoint is reserved and is not implemented.

    InternalServerError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
